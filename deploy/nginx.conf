limit_req_zone $binary_remote_addr zone=ear_req:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=ear_conn:10m;

upstream mahiear {
    server unix:/run/mahiear/http.sock max_fails=0;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ear.example.com;

    ssl_certificate     /etc/letsencrypt/live/ear.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ear.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:mahiear_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log off;
    error_log /dev/null crit;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    limit_req zone=ear_req burst=300 nodelay;
    limit_conn ear_conn 60;
    limit_req_status 429;
    limit_conn_status 429;

    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    gzip off;

    error_page 400 413 /errors/400.html;
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 429 /errors/429.html;
    error_page 500 /errors/500.html;
    error_page 502 503 504 /errors/503.html;

    location /errors/ {
        root /opt/mahiear/current/web;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-store" always;

        location ~ \.html$ {
            internal;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Robots-Tag "noindex" always;
            add_header Cache-Control "no-store" always;
        }
    }

    location / {
        proxy_pass http://mahiear;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name ear.example.com;
    access_log off;
    error_log /dev/null crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        access_log off;
    }

    location / {
        return 301 https://ear.example.com$request_uri;
    }
}
