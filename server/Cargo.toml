[package]
name = "mahiear-server"
version = "0.1.0"
edition = "2024"
license = "CC-BY-NC-SA-4.0"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.3"
axum = "0.8.9"
governor = "0.10.4"
hex = "0.4.3"
jiff = "0.2.38"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "compression-br", "compression-gzip", "set-header", "limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"
uuid = { version = "1.29.0", features = ["std", "v4"], default-features = false }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = "0.5.3"
